[project]
name = "taper"
version = "0.1.0"
description = "Scarica audio (yt-dlp), dividilo in brani, taggalo e archivialo in una libreria."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "yt-dlp",
    "mutagen>=1.47",
    "Pillow>=10",
    "PyYAML>=6",
]

[project.scripts]
taper = "taper.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
